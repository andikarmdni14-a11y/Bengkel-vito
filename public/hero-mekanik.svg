<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="Ilustrasi mekanik sedang mengerjakan motor">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="peg" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="2.5" fill="#334155"/>
    </pattern>
    <g id="wheel">
      <circle r="104" fill="#0b1220"/>
      <circle r="104" fill="none" stroke="#1f2937" stroke-width="4"/>
      <circle r="66" fill="#1e293b" stroke="#94a3b8" stroke-width="7"/>
      <g stroke="#64748b" stroke-width="5" stroke-linecap="round">
        <path d="M0-58V58M-58 0H58M-41-41L41 41M-41 41L41-41"/>
      </g>
      <circle r="18" fill="#cbd5e1"/>
      <circle r="7" fill="#475569"/>
    </g>
  </defs>

  <!-- dinding & papan alat -->
  <rect width="900" height="900" fill="url(#wall)"/>
  <rect width="900" height="610" fill="url(#peg)"/>
  <rect width="900" height="900" fill="url(#lamp)"/>

  <!-- alat tergantung di papan -->
  <g fill="none" stroke="#475569" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 120L120 250"/><circle cx="120" cy="104" r="24"/>
    <path d="M230 110L230 270M214 110H246"/>
    <path d="M330 120L360 270"/><path d="M330 120C318 92 350 84 358 108"/>
    <path d="M470 110L470 250M446 110H494M446 110V150M494 110V150"/>
    <path d="M590 120L590 280"/><rect x="574" y="90" width="32" height="36" rx="8"/>
    <path d="M700 110L760 250M760 110L700 250"/>
    <path d="M810 120V260"/><circle cx="810" cy="100" r="22"/>
  </g>
  <rect x="60" y="330" width="780" height="10" rx="5" fill="#334155"/>
  <g fill="#dc2626">
    <rect x="110" y="292" width="34" height="38" rx="6"/>
    <rect x="156" y="304" width="28" height="26" rx="6" fill="#475569"/>
  </g>

  <!-- lantai -->
  <rect y="650" width="900" height="250" fill="#0b1220"/>
  <rect y="650" width="900" height="6" fill="#dc2626" opacity="0.85"/>

  <!-- bayangan -->
  <ellipse cx="520" cy="752" rx="360" ry="26" fill="#000" opacity="0.4"/>
  <ellipse cx="170" cy="826" rx="120" ry="18" fill="#000" opacity="0.4"/>

  <!-- motor -->
  <use href="#wheel" x="340" y="648"/>
  <use href="#wheel" x="710" y="648"/>
  <!-- spakbor belakang -->
  <path d="M232 640C232 555 300 520 372 548L440 560" fill="none" stroke="#b91c1c" stroke-width="22" stroke-linecap="round"/>
  <!-- knalpot -->
  <rect x="372" y="640" width="170" height="30" rx="15" fill="#64748b"/>
  <rect x="372" y="646" width="170" height="8" rx="4" fill="#94a3b8" opacity="0.7"/>
  <!-- bodi -->
  <path d="M296 560C300 480 420 448 520 496L598 520C612 524 620 534 620 548L618 620L450 630L336 616Z" fill="#dc2626"/>
  <path d="M310 566C320 500 420 476 506 512" fill="none" stroke="#f87171" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <!-- jok -->
  <path d="M286 486C290 466 330 456 380 458L486 470C500 472 500 494 486 496L300 508C288 508 284 498 286 486Z" fill="#0f172a"/>
  <path d="M300 474C330 466 400 466 470 476" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <!-- fork, stang, lampu -->
  <path d="M630 520L706 648" stroke="#94a3b8" stroke-width="16" stroke-linecap="round"/>
  <path d="M618 500L648 440H700" fill="none" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="650" cy="510" r="26" fill="#fde68a"/>
  <circle cx="650" cy="510" r="26" fill="none" stroke="#fef3c7" stroke-width="5"/>
  <!-- spakbor depan -->
  <path d="M640 590C684 548 760 556 784 604" fill="none" stroke="#b91c1c" stroke-width="20" stroke-linecap="round"/>

  <!-- mekanik (jongkok, mengerjakan roda belakang) -->
  <!-- kaki -->
  <path d="M148 706L226 744L196 822" fill="none" stroke="#475569" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="150" y="812" width="84" height="26" rx="12" fill="#0f172a"/>
  <!-- badan -->
  <path d="M146 700L172 580" stroke="#64748b" stroke-width="72" stroke-linecap="round"/>
  <path d="M120 668H206" stroke="#dc2626" stroke-width="12" stroke-linecap="round"/>
  <!-- lengan -->
  <path d="M196 598L262 664L318 650" fill="none" stroke="#e2e8f0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="322" cy="648" r="17" fill="#d9a77f"/>
  <!-- kunci pas -->
  <path d="M296 700L362 602" stroke="#cbd5e1" stroke-width="13" stroke-linecap="round"/>
  <circle cx="368" cy="592" r="22" fill="none" stroke="#cbd5e1" stroke-width="12"/>
  <rect x="356" y="570" width="26" height="20" fill="#0b1220"/>
  <!-- kepala + topi -->
  <circle cx="190" cy="508" r="36" fill="#d9a77f"/>
  <path d="M152 504C152 470 176 456 200 458C224 460 232 484 230 500Z" fill="#dc2626"/>
  <path d="M214 498H268" stroke="#dc2626" stroke-width="12" stroke-linecap="round"/>
</svg>
